<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Bautista Caudana — Backend Developer &amp; Security Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12324a" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .sans { font-family: 'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif; }
      .hex  { fill:#00ff9c; font-size:13px; opacity:.20; }
      .col  { animation: fall 9s linear infinite; }
      .c2 { animation-duration: 12s; animation-delay: -4s; }
      .c3 { animation-duration: 10s; animation-delay: -7s; }
      .c4 { animation-duration: 14s; animation-delay: -2s; }
      .c5 { animation-duration: 11s; animation-delay: -5s; }
      @keyframes fall { from { transform: translateY(-340px); } to { transform: translateY(340px); } }
      .scanline { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0%,100% { transform: translateY(-120px); } 50% { transform: translateY(320px); } }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 980px 160px; }
      @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1); } 50% { opacity:.9; transform: scale(1.06); } }
      .ring { animation: spin 22s linear infinite; transform-origin: 980px 160px; }
      .ring2 { animation: spin 34s linear infinite reverse; transform-origin: 980px 160px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade { opacity:0; animation: in .8s ease-out forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.4s; }
      @keyframes in { from { opacity:0; transform: translateX(-12px); } to { opacity:1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- hex rain (right side) -->
    <g class="mono hex">
      <text class="col" x="770" y="0"><tspan x="770" dy="18">4F</tspan><tspan x="770" dy="18">0x1A</tspan><tspan x="770" dy="18">E3</tspan><tspan x="770" dy="18">7C</tspan><tspan x="770" dy="18">00</tspan><tspan x="770" dy="18">B9</tspan><tspan x="770" dy="18">2D</tspan><tspan x="770" dy="18">FF</tspan><tspan x="770" dy="18">91</tspan><tspan x="770" dy="18">0C</tspan><tspan x="770" dy="18">A4</tspan><tspan x="770" dy="18">5E</tspan><tspan x="770" dy="18">D0</tspan><tspan x="770" dy="18">33</tspan><tspan x="770" dy="18">8B</tspan><tspan x="770" dy="18">1F</tspan></text>
      <text class="col c2" x="830" y="0"><tspan x="830" dy="18">SSH</tspan><tspan x="830" dy="18">6A</tspan><tspan x="830" dy="18">C1</tspan><tspan x="830" dy="18">0x7F</tspan><tspan x="830" dy="18">E8</tspan><tspan x="830" dy="18">42</tspan><tspan x="830" dy="18">9D</tspan><tspan x="830" dy="18">13</tspan><tspan x="830" dy="18">B0</tspan><tspan x="830" dy="18">AA</tspan><tspan x="830" dy="18">5C</tspan><tspan x="830" dy="18">07</tspan><tspan x="830" dy="18">F2</tspan><tspan x="830" dy="18">6E</tspan><tspan x="830" dy="18">21</tspan><tspan x="830" dy="18">D9</tspan></text>
      <text class="col c3" x="1090" y="0"><tspan x="1090" dy="18">AES</tspan><tspan x="1090" dy="18">3B</tspan><tspan x="1090" dy="18">F0</tspan><tspan x="1090" dy="18">88</tspan><tspan x="1090" dy="18">0x2E</tspan><tspan x="1090" dy="18">C7</tspan><tspan x="1090" dy="18">14</tspan><tspan x="1090" dy="18">6F</tspan><tspan x="1090" dy="18">A9</tspan><tspan x="1090" dy="18">D3</tspan><tspan x="1090" dy="18">50</tspan><tspan x="1090" dy="18">EB</tspan><tspan x="1090" dy="18">09</tspan><tspan x="1090" dy="18">7A</tspan><tspan x="1090" dy="18">B4</tspan><tspan x="1090" dy="18">CE</tspan></text>
      <text class="col c4" x="1150" y="0"><tspan x="1150" dy="18">TLS</tspan><tspan x="1150" dy="18">E1</tspan><tspan x="1150" dy="18">58</tspan><tspan x="1150" dy="18">0x9C</tspan><tspan x="1150" dy="18">27</tspan><tspan x="1150" dy="18">B6</tspan><tspan x="1150" dy="18">FA</tspan><tspan x="1150" dy="18">03</tspan><tspan x="1150" dy="18">6D</tspan><tspan x="1150" dy="18">C4</tspan><tspan x="1150" dy="18">91</tspan><tspan x="1150" dy="18">1E</tspan><tspan x="1150" dy="18">A0</tspan><tspan x="1150" dy="18">47</tspan><tspan x="1150" dy="18">DB</tspan><tspan x="1150" dy="18">35</tspan></text>
      <text class="col c5" x="880" y="0"><tspan x="880" dy="18">SQL</tspan><tspan x="880" dy="18">0D</tspan><tspan x="880" dy="18">9F</tspan><tspan x="880" dy="18">A2</tspan><tspan x="880" dy="18">64</tspan><tspan x="880" dy="18">0xE5</tspan><tspan x="880" dy="18">1B</tspan><tspan x="880" dy="18">C8</tspan><tspan x="880" dy="18">73</tspan><tspan x="880" dy="18">2A</tspan><tspan x="880" dy="18">F6</tspan><tspan x="880" dy="18">8D</tspan><tspan x="880" dy="18">40</tspan><tspan x="880" dy="18">BE</tspan><tspan x="880" dy="18">17</tspan><tspan x="880" dy="18">5A</tspan></text>
    </g>

    <!-- shield emblem -->
    <g>
      <circle class="ring" cx="980" cy="160" r="112" fill="none" stroke="#00b8ff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 10"/>
      <circle class="ring2" cx="980" cy="160" r="92" fill="none" stroke="#00ff9c" stroke-opacity=".45" stroke-width="1" stroke-dasharray="60 18 6 18"/>
      <path class="pulse" d="M980 92 L1032 112 V158 C1032 194 1010 218 980 230 C950 218 928 194 928 158 V112 Z" fill="#00ff9c" fill-opacity=".05" stroke="url(#accent)" stroke-width="2"/>
      <path d="M980 92 L1032 112 V158 C1032 194 1010 218 980 230 C950 218 928 194 928 158 V112 Z" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
      <text x="980" y="172" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#e6edf3">&lt;/&gt;</text>
    </g>

    <!-- left content -->
    <g class="mono fade d1">
      <text x="64" y="78" font-size="15" fill="#00ff9c">root@baudev0<tspan fill="#7d8590">:</tspan><tspan fill="#00b8ff">~</tspan><tspan fill="#7d8590">$</tspan> <tspan fill="#c9d1d9">./whoami --verbose</tspan></text>
    </g>
    <g class="sans fade d2">
      <text x="62" y="148" font-size="60" font-weight="800" fill="#e6edf3" letter-spacing="-1">Bautista Caudana</text>
    </g>
    <g class="fade d3">
      <rect x="64" y="170" width="120" height="4" rx="2" fill="url(#accent)"/>
      <text x="64" y="210" class="sans" font-size="23" font-weight="600" fill="#c9d1d9">Backend Developer <tspan fill="#00ff9c">·</tspan> Security Enthusiast <tspan fill="#00ff9c">·</tspan> Data</text>
    </g>
    <g class="mono fade d4" font-size="14">
      <rect x="64" y="236" width="196" height="30" rx="6" fill="#00ff9c" fill-opacity=".08" stroke="#00ff9c" stroke-opacity=".45"/>
      <text x="78" y="256" fill="#00ff9c">◉ open to work</text>
      <rect x="272" y="236" width="248" height="30" rx="6" fill="#00b8ff" fill-opacity=".08" stroke="#00b8ff" stroke-opacity=".45"/>
      <text x="286" y="256" fill="#00b8ff">Ing. Informática — UCSE</text>
      <rect x="532" y="236" width="160" height="30" rx="6" fill="#ffffff" fill-opacity=".04" stroke="#7d8590" stroke-opacity=".5"/>
      <text x="546" y="256" fill="#c9d1d9">Argentina <tspan class="cursor" fill="#00ff9c">█</tspan></text>
    </g>

    <rect class="scanline" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>
    <rect width="1200" height="320" rx="14" fill="none" stroke="#1f6f5c" stroke-opacity=".6"/>
  </g>
</svg>
